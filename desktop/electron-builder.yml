appId: com.feedgrab.desktop
productName: feedgrab Desktop
electronDist: node_modules/electron/dist
directories:
  output: release-packages
files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - package.json
extraResources:
  - from: runtime/feedgrab-runtime
    to: feedgrab-runtime
  - from: session-templates
    to: session-templates
  - from: ../docs/feedgrab-icons/windows/app.ico
    to: app.ico
  - from: ../docs/feedgrab-icons/windows/Square44x44Logo.png
    to: Square44x44Logo.png
asar: true
win:
  icon: ../docs/feedgrab-icons/windows/app.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: "feedgrab-desktop-setup-${version}.exe"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: feedgrab Desktop
  include: build-resources/installer.nsh
