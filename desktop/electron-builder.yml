appId: com.feedgrab.desktop
productName: feedgrab Desktop
electronDist: node_modules/electron/dist
directories:
  output: release-packages
files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - package.json
extraResources:
  - from: runtime/feedgrab-runtime
    to: feedgrab-runtime
  - from: ../docs/feedgrab-icons/windows/app.ico
    to: app.ico
  - from: ../docs/feedgrab-icons/windows/Square44x44Logo.png
    to: Square44x44Logo.png
extraFiles:
  - from: session-templates
    to: sessions
asar: true
win:
  icon: ../docs/feedgrab-icons/windows/app.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: feedgrab Desktop
